<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="script.js?v=3" defer></script>
</head>

<body>
    <p>Answer the question</p>
    <h1>Which video is more right leaning?</h1>
    <div class="pair">
        <div>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <button onclick="chooseVideo('A')">Video A</button>
            <div class="metadata">
                <span id="video-a-title"></span>
                <span id="video-a-channel"><a id="video-a-channel-link" target="_blank" rel="noopener noreferrer"></a></span>
                <span id="video-a-description"></span>
                <span id="video-a-tags"></span>
            </div>
        </div>
        <div>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <button onclick="chooseVideo('B')">Video B</button>
            <div class="metadata">
                <span id="video-b-title"></span>
                <span id="video-b-channel"><a id="video-b-channel-link" target="_blank" rel="noopener noreferrer"></a></span>
                <span id="video-b-description"></span>
                <span id="video-b-tags"></span>
            </div>
        </div>
        <span class="progress-snippet">0 / 100</span>
        <div class="progress-bar">
            <div></div>
        </div>
    </div>
    <button class="unavailable" onclick="loadPair()">Video is unavailable</button>
</body>

</html>
